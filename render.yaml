services:
  # Inkloom Guard Backend Web Service on Render
  - type: web
    name: inkloom-guard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AI_MODEL_NAME
        value: Gemini-2.5-Pro
      - key: GEMINI_API_KEY
        sync: false
